[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessformer-replication"
version = "0.1.0"
description = "A PyTorch implementation and replication study of arXiv:2409.12272"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["torch>=2.9,<3", "numpy>=2,<3", "chess==1.11.2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
legacy = ["modal", "scipy"]

[tool.setuptools.packages.find]
include = ["chessformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
